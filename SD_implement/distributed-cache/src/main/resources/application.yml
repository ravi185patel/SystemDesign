spring:

  application:
    name: distributed-cache

  datasource:
    url: jdbc:postgresql://localhost:5432/distributed_cache
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

#  sql:
#    init:
#      mode: always

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info